name: Shared Phone CI

on:
  push:
    branches:
      - shared-phone-foundation
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend and workers
        run: pnpm build

      - name: Check shared server syntax
        run: node --check shared-server/server.mjs

      - name: Check wake engine syntax
        run: node --check shared-server/wake-engine.mjs
