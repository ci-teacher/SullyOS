name: Shared Phone CI

on:
  push:
    branches:
      - shared-phone-foundation
  pull_request:
    branches:
      - master

concurrency:
  group: shared-phone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend and workers
        run: pnpm build

      - name: Check shared server syntax
        run: node --check shared-server/server.mjs

      - name: Check wake engine syntax
        run: node --check shared-server/wake-engine.mjs

      - name: Check backup syntax
        run: node --check shared-server/backup.mjs

      - name: Smoke test shared server
        shell: bash
        run: |
          set -euo pipefail
          export SHARED_PHONE_DB=/tmp/shared-phone-ci.sqlite
          export SHARED_PHONE_MEDIA_DIR=/tmp/shared-phone-media
          export PORT=8799
          export HOST=127.0.0.1
          rm -f "$SHARED_PHONE_DB" "$SHARED_PHONE_DB-shm" "$SHARED_PHONE_DB-wal"
          rm -rf "$SHARED_PHONE_MEDIA_DIR"

          # Simulate the schema already present on the real VPS before the newer migrations.
          node --input-type=module <<'NODE'
          import { DatabaseSync } from 'node:sqlite';
          const legacyWakeDb = new DatabaseSync('/tmp/shared-phone-ci.sqlite');
          legacyWakeDb.exec(`
            CREATE TABLE diaries (
              id TEXT PRIMARY KEY,
              char_id TEXT NOT NULL,
              date TEXT NOT NULL,
              payload TEXT,
              updated_by TEXT NOT NULL,
              updated_at INTEGER NOT NULL
            );
            CREATE TABLE wake_signals (
              id TEXT PRIMARY KEY,
              reason TEXT NOT NULL,
              priority INTEGER NOT NULL DEFAULT 0,
              status TEXT NOT NULL DEFAULT 'pending',
              payload TEXT,
              created_at INTEGER NOT NULL,
              expires_at INTEGER,
              consumed_at INTEGER
            );
          `);
          legacyWakeDb.close();
          NODE

          node shared-server/server.mjs > /tmp/shared-phone-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8799/health >/tmp/shared-health.json; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:8799/health
          NOW=$(date +%s%3N)

          curl -fsS -X PUT http://127.0.0.1:8799/v1/entries/ci-letter             -H 'Content-Type: application/json'             -d '{"id":"ci-letter","author":"xiaoci","appType":"letter","title":"CI","body":"hello","visibility":"shared","createdAt":'"$NOW"',"updatedAt":'"$NOW"'}'

          curl -fsS 'http://127.0.0.1:8799/v1/entries?appType=letter'

          curl -fsS -X PUT http://127.0.0.1:8799/v1/sessions/ci-cedar             -H 'Content-Type: application/json'             -d '{"id":"ci-cedar","kind":"cedar","title":"CI game","status":"active","payload":{"roomId":"test"},"updatedBy":"xiaoci","createdAt":'"$NOW"',"updatedAt":'"$NOW"'}'

          curl -fsS 'http://127.0.0.1:8799/v1/sessions?kind=cedar'

          curl -fsS -X POST http://127.0.0.1:8799/v1/wake             -H 'Content-Type: application/json'             -d '{"reason":"ci","priority":1,"dedupeKey":"ci-wake"}'

          curl -fsS -X POST http://127.0.0.1:8799/v1/wake/claim

          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          trap - EXIT

          SHARED_PHONE_DB=/tmp/shared-phone-ci.sqlite node shared-server/wake-engine.mjs --once

          SHARED_PHONE_DB=/tmp/shared-phone-ci.sqlite \
          SHARED_PHONE_MEDIA_DIR=/tmp/shared-phone-media \
          SHARED_PHONE_BACKUP_DIR=/tmp/shared-phone-backups \
          SHARED_PHONE_BACKUP_KEEP=2 \
          node shared-server/backup.mjs

          test -f "$(find /tmp/shared-phone-backups -name shared-phone.sqlite | head -n 1)"
