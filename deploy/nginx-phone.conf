# /etc/nginx/sites-available/phone.meimeibw.cc
server {
    listen 80;
    listen [::]:80;
    server_name phone.meimeibw.cc;

    # certbot will replace/extend this when HTTPS is enabled.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phone.meimeibw.cc;

    # Managed by certbot after certificate issuance.
    ssl_certificate /etc/letsencrypt/live/phone.meimeibw.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phone.meimeibw.cc/privkey.pem;

    # One login protects both the phone UI and its private API.
    auth_basic "Xiaoci Shared Phone";
    auth_basic_user_file /etc/nginx/.htpasswd-xiaoci-phone;

    root /var/www/xiaoci-phone/dist;
    index index.html;

    client_max_body_size 30m;

    # Same-origin private API. The Node process only listens on localhost.
    location /shared-api/ {
        proxy_pass http://127.0.0.1:8791/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
