server {
    listen 80;
    listen [::]:80;
    server_name phone.meimeibw.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phone.meimeibw.cc;

    ssl_certificate /etc/letsencrypt/live/phone.meimeibw.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phone.meimeibw.cc/privkey.pem;

    root /var/www/xiaoci-phone/dist;
    index index.html;
    client_max_body_size 30m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8792/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location = /login {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:8792;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }

    location @api_unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }

    location /shared-api/ {
        auth_request /_auth_check;
        error_page 401 = @api_unauthorized;

        proxy_pass http://127.0.0.1:8791/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        auth_request /_auth_check;
        error_page 401 = @login_redirect;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }
}
